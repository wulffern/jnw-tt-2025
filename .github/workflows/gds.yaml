name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read top module name
        uses: mikefarah/yq@v4
        id: top_module
        with:
          cmd: echo TOP_MODULE=`yq '.project.top_module' info.yaml` > $GITHUB_OUTPUT

      - name: Create and publish the GDS artifact
        uses: TinyTapeout/tt-gds-action/custom_gds@ttsky25a
        with:
          top_module: ${{ steps.top_module.outputs.TOP_MODULE }}
          gds_path: gds/${{ steps.top_module.outputs.TOP_MODULE }}.gds
          lef_path: lef/${{ steps.top_module.outputs.TOP_MODULE }}.lef
          verilog_path: src/project.v

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky25a
        with:
          pdk: sky130
          tools-ref: ttsky25a

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # The TT viewer action publishes whatever ends up in gh-pages/: it fills
      # that directory with download-artifact (which merges into an existing
      # one) and then uploads the lot. Staging extra files here therefore gets
      # them published alongside the 3D viewer without forking the action.
      # Deliberately not index.html - that stays TT's redirect to the viewer.
      - name: Stage the measurement slides
        run: |
          if [ -f meas/docs/presentation.html ]; then
            mkdir -p gh-pages
            cp meas/docs/presentation.html gh-pages/presentation.html
            echo "staged=true" >> "$GITHUB_ENV"
          else
            echo "meas/docs/presentation.html not found, skipping" >&2
          fi

      - uses: TinyTapeout/tt-gds-action/viewer@ttsky25a
        with:
          pdk: sky130

      - name: Link the slides from the workflow summary
        if: env.staged == 'true'
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/presentation.html"
          echo "# Measurement slides" >> "$GITHUB_STEP_SUMMARY"
          echo "[JNW-TEMP: two temperature sensors, measured]($URL)" >> "$GITHUB_STEP_SUMMARY"

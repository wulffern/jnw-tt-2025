[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jnwtemp"
version = "0.1.0"
authors = [
  { name="Carsten Wulff", email="carsten@wulff.no" },
]
dependencies = [
    "numpy",
    "scipy",              # Welch PSD
    "PySide6",            # Qt6 GUI framework
    "pyqtgraph",          # live plotting
    "click",              # CLI parsing
    "pyserial",           # MicroPython REPL on the TT demo board
    "logic2-automation",  # Saleae Logic 2 gRPC automation
]
description = "Live temperature readout for JNW-TEMP, Tiny Tapeout project 258"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[project.optional-dependencies]
# The temperature trace uses cicwave's waveform plot when it is importable
# (A/B cursors, delta readout, z/Z/a/b/f/l keys); without it the app falls
# back to its own plot.
plot = ["cicwave"]

[project.scripts]
jnwtemp = "jnwtemp.cli:main"

[project.gui-scripts]
jnwtempw = "jnwtemp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
